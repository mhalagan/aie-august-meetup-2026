## Why it's suddenly working

<p class="stmt-sm">Small isn't beating big. Newer efficient is beating older inefficient.</p>

<p class="note-line">Better data · training recipes · tokenizers · post-training · eval loops</p>

<div class="group">
<p>Qwen 4B ≈ GPT-4o in your pocket</p>
<p>GB300 already runs 5.2-class frontier</p>
<p>Panel forecast: GLM-5.2-class on a 32GB GPU within ~18 months</p>
</div>

<div class="group">
<p><strong>Qdrant, Day 3:</strong> 540B params to clear 60% MMLU in 2022 &rarr; 3.8B two years later. <strong>142x.</strong></p>
<p class="dim">They called the gap "the lag" — frontier capability to hardware you own.</p>
</div>

</textarea></section>


<!-- ============ 12 ============ -->
<section data-markdown class="dense"><textarea data-template>

## What it actually takes

<p class="stmt-sm">A bigger model quantized to 4-bit beats a smaller model at 16-bit.</p>

<div class="group">
<p>First and last layers matter most — you can't quantize uniformly</p>
<p>NVFP4 micro block scaling · linear-attention architectures resist quantization</p>
<p>Next frontier: KV-cache compression, compaction plus quantization</p>
</div>

<div class="group">
<p>Decode is <strong>memory-bandwidth bound</strong>, not compute bound &rarr; your SLO sets your batch size</p>
<p>GQA is a baseline, not an optimization · continuous batching · speculative decoding ~3x on coding</p>
</div>

<p class="open-q">Still open: fine-tune then quantize, quantize then fine-tune, or both together?</p>

</textarea></section>


<!-- ============ 13 ============ -->
<section data-markdown class="dense"><textarea data-template>

## The honest part, and the stakes

<div class="cols">
<div class="col">
<p class="col-head">What's still broken</p>
<p>"This is way too complicated right now."</p>
<p>Which hardware for which use case: unsolved.</p>
<p>Which model for which job: routing is one piece.</p>
<p>Don't make people think about quantization.</p>
<p>Trust and safety are not the same thing.</p>
</div>
<div class="col">
<p class="col-head">What's coming</p>
<p>Constant cost visibility is becoming a CFO problem. Jevons paradox.</p>
<p>The vast majority of what we need AI for doesn't need a frontier model.</p>
<p><strong>Only ~10% of people have ever run a model locally.</strong></p>
<p>"The most consequential year for how AI gets distributed."</p>
</div>
</div>

</textarea></section>
